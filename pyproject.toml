[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qfbs"
version = "0.1.0"
description = "Transparent quantitative football probability and betting research toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
dashboard = ["streamlit>=1.30", "plotly>=5.18"]

[tool.setuptools.packages.find]
include = ["qfbs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
